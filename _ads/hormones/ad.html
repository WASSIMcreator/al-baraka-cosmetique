<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>AL BARAKA hormones ad</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Reem+Kufi:wght@700&display=block" rel="stylesheet">
<style>
:root{--W:1080px;--H:1350px;--deep:#1c0510;--plum:#3a0a20;--wine:#6b1231;--rose:#e8265e;--blush:#ffd6e2;--gold:#f7c978;
  --hook:96px;--prod:560px;--pill:32px;--cta:46px;--chip:28px;--top:56px;--bottom:48px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--deep);font-family:'Cairo',sans-serif;color:#fff}
.ad{position:relative;width:var(--W);height:var(--H);overflow:hidden;background:radial-gradient(90% 60% at 50% 52%,var(--wine) 0%,var(--plum) 45%,var(--deep) 100%)}
.c{position:absolute;inset:0;padding:var(--top) 60px var(--bottom);display:flex;flex-direction:column;align-items:center}
.c>*{flex-shrink:0}
.head{width:100%;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:12px;direction:ltr}
.logo svg{width:34px;height:42px}
.logo b{font-family:'Reem Kufi';font-size:30px;letter-spacing:.08em;line-height:1}
.chip0{background:rgba(255,92,138,.14);border:2px solid rgba(255,92,138,.4);color:var(--blush);font-weight:800;font-size:28px;padding:2px 22px;border-radius:99px}
.hook{margin-top:24px;text-align:center;font-family:'Reem Kufi';font-size:var(--hook);line-height:1.18;text-shadow:0 6px 24px rgba(0,0,0,.45)}
.hook em{font-style:normal;color:var(--gold)}
.chips{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.chips span{background:#fff;color:var(--wine);font-weight:800;font-size:var(--chip);padding:2px 18px 6px;border-radius:12px}
.prod{position:relative;width:calc(var(--prod)*1.5);height:var(--prod);margin-top:16px}
.spot{position:absolute;left:50%;top:50%;width:var(--prod);height:var(--prod);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff 0%,#fbe3ea 45%,rgba(240,194,208,.0) 72%)}
.img{position:absolute;left:50%;top:50%;width:calc(var(--prod)*1.05);height:calc(var(--prod)*1.05);transform:translate(-50%,-50%);background:url(../../hormones/jar.jpg) center/cover;
  -webkit-mask:radial-gradient(closest-side,#000 70%,transparent 100%);mask:radial-gradient(closest-side,#000 70%,transparent 100%);mix-blend-mode:multiply}
.badge{position:absolute;left:4%;bottom:6%;width:calc(var(--prod)*.38);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 55%,#e0a646);color:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 0 0 10px rgba(247,201,120,.22),0 20px 40px rgba(0,0,0,.45)}
.badge b{font-size:calc(var(--prod)*.16);font-weight:900;line-height:.9}
.badge small{font-size:calc(var(--prod)*.06);font-weight:900}
.month{position:absolute;right:3%;top:10%;background:var(--rose);color:#fff;font-weight:900;font-size:calc(var(--pill)*.95);padding:6px 22px 10px;border-radius:16px;transform:rotate(5deg);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.pills{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.pill{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);font-weight:800;font-size:var(--pill);padding:6px 24px 10px;border-radius:99px;white-space:nowrap}
.cta{margin-top:22px;width:100%;border-radius:99px;background:linear-gradient(135deg,#ff7aa0,var(--rose) 55%,#b8123f);font-weight:900;font-size:var(--cta);text-align:center;padding:12px 0 18px;box-shadow:0 18px 40px -12px rgba(232,38,94,.8)}
.foot{margin-top:14px;font-weight:700;font-size:24px;color:#d8b3c0}
.square{--W:1080px;--H:1080px;--hook:76px;--prod:420px;--pill:27px;--cta:38px;--chip:24px;--top:42px;--bottom:34px}
.square .chips{margin-top:12px}.square .cta{margin-top:16px}
.story{--W:1080px;--H:1920px;--hook:100px;--prod:600px;--pill:32px;--cta:48px;--chip:29px;--top:250px;--bottom:350px}
</style>
</head>
<body>
<div class="ad"><div class="c">
  <div class="head">
    <div class="logo"><svg viewBox="0 0 160 200"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9b872"/><stop offset="1" stop-color="#d9955a"/></linearGradient><mask id="h"><rect width="160" height="200" fill="#fff"/><circle cx="80" cy="92" r="9" fill="#000"/></mask></defs><path d="M28 194 V104 C16 88 15 64 26 46 A61 61 0 0 1 134 46 C145 64 144 88 132 104 V194" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/><g mask="url(#h)"><g transform="translate(80 92)" fill="url(#g)"><rect x="-22" y="-22" width="44" height="44" rx="2"/><rect x="-22" y="-22" width="44" height="44" rx="2" transform="rotate(45)"/></g></g></svg><b>AL BARAKA</b></div>
    <div class="chip0">🌸 جديد</div>
  </div>
  <div class="hook">توازنك <em>الأنثوي</em><br>ف كبسولة وحدة</div>
  <div class="chips"><span>فيتكس</span><span>ماكا</span><span>أشواغاندا</span><span>صوجا</span></div>
  <div class="prod">
    <div class="spot"></div><div class="img"></div>
    <div class="badge"><b>180</b><small>DH</small></div>
    <div class="month">علبة = شهر</div>
  </div>
  <div class="pills"><div class="pill">💵 الدفع عند الاستلام</div><div class="pill">🚚 التوصيل مجاني</div></div>
  <div class="cta">اطلبي دابا 👇</div>
  <div class="foot">مكمل غذائي · ماشي دوا · مختبر معتمد ONSSA</div>
</div></div>
<script>document.documentElement.className=new URLSearchParams(location.search).get('f')||'feed'</script>
</body>
</html>
