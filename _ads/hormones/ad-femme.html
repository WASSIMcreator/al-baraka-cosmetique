<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>AL BARAKA hormones ad (photo)</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Reem+Kufi:wght@700&display=block" rel="stylesheet">
<style>
:root{--W:1080px;--H:1350px;--deep:#1c0510;--plum:#3a0a20;--wine:#6b1231;--rose:#e8265e;--blush:#ffd6e2;--gold:#f7c978;
  --photo:62%;--hook:80px;--sub:34px;--prod:400px;--chip:30px;--pill:30px;--cta:44px;--pad:56px;--top:0px;--bottom:44px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--deep);font-family:'Cairo',sans-serif;color:#fff}
.ad{position:relative;width:var(--W);height:var(--H);overflow:hidden;background:var(--plum)}
.photo{position:absolute;left:0;right:0;top:var(--top);height:var(--photo);background:url(femme.jpg) 50% 46%/cover}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,5,16,.15) 0%,rgba(28,5,16,0) 30%,rgba(58,10,32,.6) 62%,var(--plum) 96%)}
.logo{position:absolute;top:calc(var(--top) + 40px);right:44px;display:flex;align-items:center;gap:12px;direction:ltr;background:rgba(28,5,16,.72);padding:10px 22px;border-radius:99px;z-index:2}
.logo svg{width:28px;height:35px}
.logo b{font-family:'Reem Kufi';font-size:26px;letter-spacing:.08em;line-height:1}
.c{position:absolute;left:0;right:0;bottom:var(--bottom);padding:0 var(--pad);display:flex;flex-direction:column;align-items:stretch}
.hook{text-align:center;font-family:'Reem Kufi';font-size:var(--hook);line-height:1.2;text-shadow:0 6px 26px rgba(0,0,0,.6)}
.hook em{font-style:normal;color:var(--gold)}
.sub{text-align:center;font-weight:700;font-size:var(--sub);color:#f6dbe3;margin-top:8px;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.row{display:flex;align-items:center;gap:26px;margin-top:22px}
.prod{position:relative;flex:0 0 var(--prod);height:var(--prod)}
.spot{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fbe3ea 50%,rgba(240,194,208,0) 72%)}
.img{position:absolute;inset:-4%;background:url(../../hormones/jar.jpg) center/cover;-webkit-mask:radial-gradient(closest-side,#000 70%,transparent 100%);mask:radial-gradient(closest-side,#000 70%,transparent 100%);mix-blend-mode:multiply}
.badge{position:absolute;right:-6%;bottom:-4%;width:calc(var(--prod)*.42);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 55%,#e0a646);color:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 0 0 9px rgba(247,201,120,.22),0 18px 36px rgba(0,0,0,.45)}
.badge b{font-size:calc(var(--prod)*.17);font-weight:900;line-height:.9}
.badge small{font-size:calc(var(--prod)*.065);font-weight:900}
.info{flex:1;display:flex;flex-direction:column;gap:12px}
.info .t{font-weight:900;font-size:calc(var(--chip)*1.15);line-height:1.25}
.info .t span{color:var(--rose);direction:ltr;unicode-bidi:isolate}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips span{background:#fff;color:var(--wine);font-weight:800;font-size:var(--chip);padding:2px 10px 6px;border-radius:12px;text-align:center}
.month{align-self:flex-start;background:var(--rose);color:#fff;font-weight:900;font-size:var(--chip);padding:4px 18px 8px;border-radius:14px}
.pills{display:flex;gap:12px;justify-content:center;margin-top:24px}
.pill{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);font-weight:800;font-size:var(--pill);padding:6px 22px 10px;border-radius:99px;white-space:nowrap}
.cta{margin-top:18px;border-radius:99px;background:linear-gradient(135deg,#ff7aa0,var(--rose) 55%,#b8123f);font-weight:900;font-size:var(--cta);text-align:center;padding:12px 0 18px;box-shadow:0 18px 40px -12px rgba(232,38,94,.8)}
.foot{margin-top:12px;font-weight:700;font-size:22px;color:#d8b3c0;text-align:center}
.square{--W:1080px;--H:1080px;--photo:56%;--hook:66px;--sub:28px;--prod:300px;--chip:25px;--pill:25px;--cta:36px;--bottom:30px}
.square .row{margin-top:14px}.square .pills{margin-top:14px}.square .cta{margin-top:12px}.square .foot{display:none}
.story{--W:1080px;--H:1920px;--photo:58%;--hook:86px;--sub:36px;--prod:420px;--chip:31px;--pill:31px;--cta:46px;--top:0px;--bottom:350px}
.story .logo{top:260px}
</style>
</head>
<body>
<div class="ad">
  <div class="photo"></div>
  <div class="logo"><svg viewBox="0 0 160 200"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9b872"/><stop offset="1" stop-color="#d9955a"/></linearGradient><mask id="h"><rect width="160" height="200" fill="#fff"/><circle cx="80" cy="92" r="9" fill="#000"/></mask></defs><path d="M28 194 V104 C16 88 15 64 26 46 A61 61 0 0 1 134 46 C145 64 144 88 132 104 V194" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/><g mask="url(#h)"><g transform="translate(80 92)" fill="url(#g)"><rect x="-22" y="-22" width="44" height="44" rx="2"/><rect x="-22" y="-22" width="44" height="44" rx="2" transform="rotate(45)"/></g></g></svg><b>AL BARAKA</b></div>
  <div class="c">
    <div class="hook">أيام الدورة <em>ماشي خاصها</em><br>تكون هكا 💔</div>
    <div class="sub">رجعي لراحتك بطريقة طبيعية 🌸</div>
    <div class="row">
      <div class="prod"><div class="spot"></div><div class="img"></div><div class="badge"><b>180</b><small>DH</small></div></div>
      <div class="info">
        <div class="t"><span>Hormones Féminines</span><br>4 نباتات ف كبسولة</div>
        <div class="chips"><span>فيتكس</span><span>ماكا</span><span>أشواغاندا</span><span>صوجا</span></div>
        <div class="month">علبة = شهر كامل</div>
      </div>
    </div>
    <div class="pills"><div class="pill">💵 الدفع عند الاستلام</div><div class="pill">🚚 التوصيل مجاني</div></div>
    <div class="cta">اطلبي دابا 👇</div>
    <div class="foot">مكمل غذائي · ماشي دوا · مختبر معتمد ONSSA</div>
  </div>
</div>
<script>document.documentElement.className=new URLSearchParams(location.search).get('f')||'feed'</script>
</body>
</html>
