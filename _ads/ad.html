<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>AL BARAKA toux ad</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Reem+Kufi:wght@700&display=block" rel="stylesheet">
<style>
:root{--W:1080px;--H:1350px;--deep:#041c21;--teal:#0a3d46;--teal2:#0f5662;--aqua:#1ec8e0;--aqua2:#7fe6f2;--gold:#f7c978;--ember:#e8662a;
  --hook:92px;--prod:600px;--pill:34px;--cta:46px;--top:56px;--bottom:48px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:var(--deep);font-family:'Cairo',sans-serif;color:#fff}
.ad{position:relative;width:var(--W);height:var(--H);overflow:hidden;background:radial-gradient(90% 60% at 50% 55%,var(--teal2) 0%,var(--teal) 45%,var(--deep) 100%)}
.glow{position:absolute;left:50%;top:58%;width:900px;height:600px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(30,200,224,.45),transparent);pointer-events:none}
.c{position:absolute;inset:0;padding:var(--top) 60px var(--bottom);display:flex;flex-direction:column;align-items:center}
.c>*{flex-shrink:0}
.head{width:100%;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:12px;direction:ltr}
.logo svg{width:34px;height:42px}
.logo b{font-family:'Reem Kufi';font-size:30px;letter-spacing:.08em;line-height:1}
.chip{background:rgba(127,230,242,.12);border:2px solid rgba(127,230,242,.35);color:var(--aqua2);font-weight:800;font-size:28px;padding:2px 22px;border-radius:99px}
.hook{margin-top:26px;text-align:center;font-family:'Reem Kufi';font-size:var(--hook);line-height:1.18;text-shadow:0 6px 24px rgba(0,0,0,.5)}
.hook em{font-style:normal;color:var(--gold)}
.sub{margin-top:12px;font-weight:700;font-size:calc(var(--hook)*.4);color:#d8eef1;text-align:center}
.prod{position:relative;width:calc(var(--prod)*1.35);height:var(--prod);margin-top:10px}
.prod .img{position:absolute;inset:0;background:url(../toux/pack.jpg) 50% 100%/calc(var(--prod)*1.9) no-repeat;
  -webkit-mask:radial-gradient(60% 62% at 50% 56%,#000 62%,transparent 100%);mask:radial-gradient(60% 62% at 50% 56%,#000 62%,transparent 100%)}
.badge{position:absolute;left:0;top:14%;width:calc(var(--prod)*.36);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 55%,#e0a646);color:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 0 0 10px rgba(247,201,120,.2),0 20px 40px rgba(0,0,0,.5)}
.badge b{font-size:calc(var(--prod)*.15);font-weight:900;line-height:.9}
.badge small{font-size:calc(var(--prod)*.055);font-weight:900}
.names{position:absolute;right:-3%;top:-1%;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.names span{background:#fff;color:var(--deep);font-weight:800;font-size:calc(var(--pill)*.82);padding:4px 18px 8px;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.pills{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.pill{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);font-weight:800;font-size:var(--pill);padding:6px 24px 10px;border-radius:99px;white-space:nowrap}
.cta{margin-top:24px;width:100%;border-radius:99px;background:linear-gradient(135deg,#ffb35c,var(--ember) 55%,#c2441b);font-weight:900;font-size:var(--cta);text-align:center;padding:12px 0 18px;box-shadow:0 18px 40px -12px rgba(232,102,42,.8)}
.foot{margin-top:14px;font-weight:700;font-size:24px;color:#9fc2c7}
.square{--W:1080px;--H:1080px;--hook:74px;--prod:450px;--pill:28px;--cta:38px;--top:44px;--bottom:36px}
.square .sub{display:none}
.story{--W:1080px;--H:1920px;--hook:96px;--prod:640px;--pill:34px;--cta:48px;--top:250px;--bottom:350px}
</style>
</head>
<body>
<div class="ad">
  <div class="glow"></div>
  <div class="c">
    <div class="head">
      <div class="logo"><svg viewBox="0 0 160 200"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9b872"/><stop offset="1" stop-color="#d9955a"/></linearGradient><mask id="h"><rect width="160" height="200" fill="#fff"/><circle cx="80" cy="92" r="9" fill="#000"/></mask></defs><path d="M28 194 V104 C16 88 15 64 26 46 A61 61 0 0 1 134 46 C145 64 144 88 132 104 V194" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/><g mask="url(#h)"><g transform="translate(80 92)" fill="url(#g)"><rect x="-22" y="-22" width="44" height="44" rx="2"/><rect x="-22" y="-22" width="44" height="44" rx="2" transform="rotate(45)"/></g></g></svg><b>AL BARAKA</b></div>
      <div class="chip">🌿 Pack جديد</div>
    </div>
    <div class="hook">قررتي تحبس <em>الكارو</em>؟<br>والكحة ما بغاتش تخليك؟</div>
    <div class="sub">سيروب بالعسل والزنجبيل + كبسولات ترافقك ف هاد المرحلة</div>
    <div class="prod">
      <div class="img"></div>
      <div class="badge"><b>229</b><small>DH</small></div>
      <div class="names"><span>🍯 سيروب الكحة 125ml</span><span>🚭 60 كبسولة</span></div>
    </div>
    <div class="pills"><div class="pill">💵 الدفع عند الاستلام</div><div class="pill">🚚 التوصيل مجاني</div></div>
    <div class="cta">اطلب الـPack دابا 👇</div>
    <div class="foot">مكمل غذائي · ماشي دوا · مختبر معتمد ONSSA</div>
  </div>
</div>
<script>document.documentElement.className=new URLSearchParams(location.search).get('f')||'feed'</script>
</body>
</html>
